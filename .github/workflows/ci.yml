name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --locked ruff check src tests

      - name: Type check (mypy)
        run: uv run --locked mypy src

      - name: Tests (pytest)
        run: uv run --locked pytest -q
